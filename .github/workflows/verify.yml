
name: CivicConnect verification


on:
  push:
    branches:
      - main
      - feature/m3-data-persistence
  pull_request:
    branches:
      - main


permissions:
  contents: read

jobs:
  civicconnect-build-and-check:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__CivicConnect: "Host=localhost;Port=5432;Database=civicconnect_test;Username=postgres;Password=testpassword"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: civicconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build verification project
        run: dotnet build tests/CivicConnect.Verification/CivicConnect.Verification.csproj --configuration Release

      - name: Run existing verification checks
        run: dotnet run --project tests/CivicConnect.Verification --configuration Release --no-build

      - name: Build database tests
        run: dotnet build tests/CivicConnect.DatabaseTests/CivicConnect.DatabaseTests.csproj --configuration Release

      - name: Run database integration tests
        env:
          ConnectionStrings__CivicConnect: "Host=localhost;Port=5432;Database=civicconnect_test;Username=postgres;Password=testpassword"
        run: dotnet run --project tests/CivicConnect.DatabaseTests --configuration Release --no-build

      - name: Scan repository for secrets
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git --no-banner --redact --exit-code 1 /repo