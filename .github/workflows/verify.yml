name: CivicConnect verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  civicconnect-build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build tests/CivicConnect.Verification/CivicConnect.Verification.csproj --configuration Release
      - run: dotnet run --project tests/CivicConnect.Verification --configuration Release --no-build
