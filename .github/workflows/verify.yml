
name: CivicConnect verification


on:
  push:
    branches:
      - main
      - feature/m4-security-operations
      - feature/m3-data-persistence
      - feature/cameron-m3-integration
  pull_request:
    branches:
      - main


permissions:
  contents: read

jobs:
  civicconnect-build-and-check:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__CivicConnect: "Host=localhost;Port=5432;Database=civicconnect_test;Username=postgres;Password=testpassword"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: civicconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build verification project
        run: dotnet build tests/CivicConnect.Verification/CivicConnect.Verification.csproj --configuration Release

      - name: Run existing verification checks
        run: dotnet run --project tests/CivicConnect.Verification --configuration Release --no-build

      - name: Build database tests
        run: dotnet build tests/CivicConnect.DatabaseTests/CivicConnect.DatabaseTests.csproj --configuration Release -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true

      - name: Run database integration tests
        env:
          ConnectionStrings__CivicConnect: "Host=localhost;Port=5432;Database=civicconnect_test;Username=postgres;Password=testpassword"
        run: dotnet run --project tests/CivicConnect.DatabaseTests --configuration Release --no-build


      - name: Scan repository for secrets
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git --config /repo/.gitleaks.toml --no-banner --verbose --redact --exit-code 1 /repo

      - name: Build M3 tests and run SDK code analysis
        run: dotnet build tests/CivicConnect.M3Tests --configuration Release -p:AnalysisLevel=latest -p:EnforceCodeStyleInBuild=true -p:NuGetAuditMode=all

      - name: Run M3 black-box API and system cases
        run: dotnet run --project tests/CivicConnect.M3Tests --configuration Release --no-build -- --database

      - name: Build performance project and audit dependencies
        run: dotnet build tests/CivicConnect.PerformanceTests --configuration Release -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true

      - name: Build M4 presentation and contract checks
        run: dotnet build tests/CivicConnect.M4Tests --configuration Release -p:NuGetAuditMode=all

      - name: Run M4 black-box UI and synthetic contract journey
        run: dotnet run --project tests/CivicConnect.M4Tests --configuration Release --no-build

      - name: Run separate database-read performance exercise
        run: dotnet run --project tests/CivicConnect.PerformanceTests --configuration Release --no-build

      - name: Check dependency advisories
        run: |
          dotnet list src/CivicConnect.Web package --include-transitive --vulnerable --format json > dependency-report.json
          python3 tools/check_dependencies.py dependency-report.json

